name: Automated Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Agentic Flow Test Suite
      env:
        PYTHONPATH: .
        OPENAI_API_KEY: "sk-mock-testing-key-for-ci"
        HF_TOKEN: "hf-mock-testing-key-for-ci"
        TASK_3_ENABLED: "False"
      run: |
        pytest tests/ -v --durations=10